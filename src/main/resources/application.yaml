server:
  port: ${PORT:5000}
  address: 0.0.0.0

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/medical_app?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&enabledTLSProtocols=TLSv1.2}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:mikel2006@}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
        use_sql_comments: false
    defer-datasource-initialization: true
  
  main:
    lazy-initialization: true

  servlet:
    multipart:
      enabled: true  
      max-file-size: 500MB
      max-request-size: 500MB

  # Gmail SMTP - used in both dev and prod
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:qualitestmedical@gmail.com}
    password: ${MAIL_PASSWORD:qmlwmmjrtkczfgyc}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET:MedicalAppSecretKeyForauthTokenGeneration2024ChangeThisInProduction}
  expiration: ${JWT_EXPIRATION:86400000}

app:
  file:
    upload-dir: ${UPLOAD_DIR:/tmp/uploads/results}
    export-dir: ${EXPORT_DIR:/tmp/uploads/exports}
    max-size: 500MB

  support:
    business-hours:
      start: "09:00"
      end: "18:00"
    ticket-daily-limit: 5
    response-time: "4-6 hours"
    emergency-contact: "+234-XXX-XXXX"

  export:
    storage-dir: ${EXPORT_STORAGE_DIR:/tmp/exports}
    max-file-size: 500MB
    retention-days: 7
    allowed-formats: JSON,XML,CSV,FHIR,PDF

  security:
    cors:
      allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5500,http://localhost:5500,http://172.16.60.226:3000,http://172.16.60.226:8081,exp://172.16.60.226:8081,exp://172.16.60.226:19000,http://172.16.60.226:19000}
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH,HEAD
      allowed-headers: Authorization,Content-Type,Accept,Origin,X-Requested-With,Access-Control-Request-Method,Access-Control-Request-Headers
      allow-credentials: true
      max-age: 3600
    
  notification:
    sms:
      enabled: true
      provider: "twilio"
      api-key: ${SMS_API_KEY:}
    email:
      enabled: true
      from: "qualitestmedical@gmail.com"
    push:
      enabled: true

logging:
  level:
    com.medicalapp.medical_app_backend: ${LOG_LEVEL:INFO}
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.springframework.web.cors: WARN
    org.hibernate.SQL: ERROR
    org.hibernate.type.descriptor.sql.BasicBinder: ERROR
  pattern:
    console: "%d{HH:mm:ss} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    defaults:
      enabled: true

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:mysql://localhost:3306/medical_app?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: mikel2006@

  mail:
    host: smtp.gmail.com
    port: 587
    username: qualitestmedical@gmail.com
    password: qmlwmmjrtkczfgyc
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    com.medicalapp.medical_app_backend: DEBUG

---
# Production Profile (Railway)
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  
  main:
    lazy-initialization: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:qualitestmedical@gmail.com}
    password: ${MAIL_PASSWORD:qmlwmmjrtkczfgyc}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    com.medicalapp.medical_app_backend: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN

app:
  file:
    upload-dir: /tmp/uploads/results
    export-dir: /tmp/uploads/exports
  export:
    storage-dir: /tmp/exports
  security:
    cors:
      allowed-origins: ${CORS_ORIGINS}
